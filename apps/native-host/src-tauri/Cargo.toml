[package]
name = "glasskit-native-host"
version = "0.1.0"
description = "Minimal Tauri host for Glass Kit native DWM material"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
glasskit-material = { path = "../../../packages/material-tauri", features = ["tauri"] }
