[package]
name = "glasskit-material"
version = "0.1.0"
edition = "2021"
description = "Native Windows DWM glass and rounded corners for Tauri apps"
license = "MIT"
repository = "https://github.com/LowPolyPhosphorus/GlassKit"

[lib]
name = "glasskit_material"
path = "src/lib.rs"

[features]
default = []
tauri = ["dep:tauri"]

[dependencies]
tauri = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
] }
